name: Release checks

# Enable automatic pull_request/push checks after a clean-checkout hosted run has
# passed. Preparing this workflow does not publish or deploy the application.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HARMONIOUS_BROWSER: chromium
      WRANGLER_SEND_METRICS: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the pinned Playwright browser
        # Use the installed package directly; do not let npx fetch a fallback.
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run the same local release checks
        run: node scripts/verify.mjs
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-check-diagnostics
          path: |
            build/verification/
            build/design-review/
          retention-days: 7
          if-no-files-found: ignore
